# Gatewai cloud — Render Blueprint
# Persistent disk at /var/data keeps Projects/ and System/ across deploys.
# Set GEMINI_API_KEY, DEEPSEEK_API_KEY, and GATEWAI_PASSWORD in the Dashboard
# (or approve_blueprint env prompts). Single instance only — SQLite is not multi-writer safe.

services:
  - type: web
    name: gatewai
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: GATEWAI_DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GATEWAI_PASSWORD
        sync: false
    disk:
      name: gatewai-data
      mountPath: /var/data
      sizeGB: 5
